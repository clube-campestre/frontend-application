name: Build and Deploy Frontend

on:
  push:
    branches: [ "ci_implement_test" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU para multi-plataforma (opcional mas recomendado)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx (necessário para docker/build-push-action)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login no Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build e Push usando ação oficial do Docker
      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/desbravadores-frontend:latest

      # Configuração das chaves SSH
      - name: Configure SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DESBRAVADORES_SSH_KEY }}" > ~/.ssh/bastion.pem
          echo "${{ secrets.DESBRAVADORES_SSH_KEY }}" > ~/.ssh/private.pem
          chmod 600 ~/.ssh/bastion.pem
          chmod 600 ~/.ssh/private.pem

      - name: Deploy via docker-compose (using Bastion)
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ProxyJump=ubuntu@${{ secrets.BASTION_PUBLIC_IP }} \
              -i ~/.ssh/private.pem \
              ubuntu@${{ secrets.FRONT_PRIVATE_IP }} \
              "cd /home/ubuntu/frontend && docker compose pull && docker compose up -d"
